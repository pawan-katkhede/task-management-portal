spring.application.name=task-management-backend

# ============================================
# Server Configuration
# ============================================
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always
server.servlet.context-path=/

# ============================================
# MySQL Database Configuration
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/task_manager?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=taskuser
spring.datasource.password=task123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / Hibernate Configuration
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# ============================================
# JWT Configuration
# ============================================
jwt.secret=4f2a8d7e9c1b5f3e6a2d8c7b4e9f1a3d6c8b2e5a7d9f1c3b6e8a2d4c7f9e5b1a3
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ============================================
# Google Gemini AI API Configuration
# ============================================
# Google Gemini AI API Configuration
gemini.api.key=AIzaSyCrHSCGI5yMLs8sDB-o2gULw8bMfe2RkEA
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
gemini.model=gemini-2.5-flash
gemini.temperature=0.7
gemini.max-tokens=2048

# ============================================
# Logging Configuration
# ============================================
logging.level.root=INFO
logging.level.com.taskmanager=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/task-management-backend.log
logging.file.max-size=10MB
logging.file.max-history=30

# ============================================
# Jackson JSON Configuration
# ============================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSZ

# ============================================
# File Upload Configuration
# ============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# ============================================
# Actuator
# ============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# ============================================
# Application Specific
# ============================================
app.pagination.default-page-size=10
app.pagination.max-page-size=50
app.task.default-priority=MEDIUM